################
### MONITORS ###
################

source = ~/.config/hypr/monitors.conf


###################
### PROGRAMS ###
###################

$terminal = kitty
$fileManager = Nautilus
$menu = tofi-drun | xargs -r hyprctl dispatch exec --



#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = swww-daemon
exec-once = emacs --daemon


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = WLR_RENDERER,vulkan
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = __GL_THREADED_OPTIMIZATIONS,1


#####################
### LOOK & FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }

    # sharp tiling (no rounding overhead anywhere)
    rounding = 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true

    animate_manual_resizes = false
    animate_mouse_windowdragging = false

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    enable_swallow = true
}


##############################
### FULLSCREEN BEHAVIOR
##############################

# global fullscreen optimization (replacement for windowrulev2 immediate)
misc {
    vrr = 1
}


#############
### INPUT ###
#############

input {
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
}


####################
### KEYBINDINGS ###
####################

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, Print, exec, hyprshot -m region


# -------------------------
# SCREENSHOTS (OPTIMIZED)
# -------------------------

bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/shot-$(date +%s).png

bind = $mainMod CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy -t image/png

bind = $mainMod SHIFT, Print, exec, grim - | wl-copy -t image/png


# -------------------------
# AUDIO
# -------------------------

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# -------------------------
# WINDOW NAVIGATION
# -------------------------

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d


# -------------------------
# WORKSPACES
# -------------------------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
